  <script type="application/json" id="cmsDefaults">[{"name":"Hero","fields":[{"key":"hero.eyebrow","type":"text","label":"Eyebrow","value":"Legal","hint":""},{"key":"hero.title","type":"text","label":"Headline","value":"Privacy Policy & Terms of Use","hint":""},{"key":"hero.lead","type":"text","label":"Intro","value":"Your health information is among the most sensitive data there is. This page explains how we protect it, and the terms that apply when you use our website and services.","hint":""},{"key":"hero.updated","type":"text","label":"Last updated badge","value":"Last updated: 1 September 2026","hint":""},{"key":"hero.badge","type":"text","label":"Compliance badge","value":"NDPA 2023 compliant","hint":""}]},{"name":"Legal text","fields":[{"key":"toc","type":"list","label":"Contents links","fields":[{"key":"link","type":"link","label":"Link","hint":""}],"value":[{"link":{"text":"1. Who we are","href":"#who"}},{"link":{"text":"2. Information we collect","href":"#collect"}},{"link":{"text":"3. How we use it","href":"#use"}},{"link":{"text":"4. Sharing & disclosure","href":"#share"}},{"link":{"text":"5. Security & retention","href":"#security"}},{"link":{"text":"6. Your rights","href":"#rights"}},{"link":{"text":"7. Cookies & website data","href":"#cookies"}},{"link":{"text":"8. Children & elders","href":"#children"}},{"link":{"text":"9. Terms of use","href":"#terms"}},{"link":{"text":"10. Contact","href":"#contact"}}],"hint":"Link must match a section id, e.g. #who"},{"key":"sec.who.title","type":"text","label":"Section 1 title","value":"Who we are","hint":""},{"key":"sec.who.body","type":"html","label":"Section 1 body (HTML)","value":"<p>Heirs Multispecialist Hospital (\"Heirs\", \"we\", \"us\") operates hospitals at Beside Aluko House, Irare Estate, Oye-Ekiti and Plot 3, Orimolade Crescent, Ilokun Estate, Ado-Ekiti, Ekiti State, Nigeria, together with Fosterheirs Mental Health Consultancy, Heirs Institute of Allied Health and Heirs Missions (the Methuselah Project). We are the data controller for personal and health information collected through our facilities and this website, and we process it in line with the Nigeria Data Protection Act 2023 and applicable medical-confidentiality rules.<\/p>","hint":"Paragraphs as <p>, lists as <ul><li>"},{"key":"sec.collect.title","type":"text","label":"Section 2 title","value":"Information we collect","hint":""},{"key":"sec.collect.body","type":"html","label":"Section 2 body (HTML)","value":"<ul>\n            <li><strong>Identity &amp; contact details<\/strong>, name, date of birth, gender, phone, email, address, next of kin, ID number.<\/li>\n            <li><strong>Health information<\/strong>, symptoms, diagnoses, test results, imaging, prescriptions, treatment notes, mental-health and addiction-recovery records, allergies and family history.<\/li>\n            <li><strong>Insurance &amp; billing<\/strong> - NHIS/HMO numbers, invoices and payment records (we never store full card numbers).<\/li>\n            <li><strong>Website data<\/strong>, information you type into our appointment, feedback, admission or Fosterheirs enquiry forms, and basic technical data such as browser type and pages visited.<\/li>\n            <li><strong>Programme data<\/strong> - Methuselah Project pre-registrations (age, financial-hardship confirmation, ID type) and Heirs Institute applications (academic credentials, photographs, medical-fitness certificates).<\/li>\n          <\/ul>","hint":"Paragraphs as <p>, lists as <ul><li>"},{"key":"sec.use.title","type":"text","label":"Section 3 title","value":"How we use your information","hint":""},{"key":"sec.use.body","type":"html","label":"Section 3 body (HTML)","value":"<ul>\n            <li>To provide safe, coordinated medical care across our departments and branches.<\/li>\n            <li>To schedule and confirm appointments, send results and follow-up reminders.<\/li>\n            <li>To process NHIS/HMO claims and billing.<\/li>\n            <li>To run our programmes, admissions, scholarships, therapy sessions and free elder clinics.<\/li>\n            <li>To improve our services through anonymised quality audits and patient-feedback surveys.<\/li>\n            <li>To meet legal and public-health reporting obligations.<\/li>\n          <\/ul>\n          <p>We do not sell personal information, and we do not use health information for marketing without your explicit consent.<\/p>","hint":"Paragraphs as <p>, lists as <ul><li>"},{"key":"sec.share.title","type":"text","label":"Section 4 title","value":"Sharing & disclosure","hint":""},{"key":"sec.share.body","type":"html","label":"Section 4 body (HTML)","value":"<p>Your information is shared only with: clinicians involved in your care (including visiting consultants); laboratories, imaging centres or hospitals we refer you to, with your knowledge; your NHIS/HMO for claims; regulators or courts where the law requires; and trusted service providers (e.g. secure messaging, hosting) bound by confidentiality. Mental-health and addiction-recovery records held by Fosterheirs are subject to additional confidentiality and are shared within the hospital only with your consent or in an emergency.<\/p>","hint":"Paragraphs as <p>, lists as <ul><li>"},{"key":"sec.security.title","type":"text","label":"Section 5 title","value":"Security & retention","hint":""},{"key":"sec.security.body","type":"html","label":"Section 5 body (HTML)","value":"<p>Records are protected by physical access controls, role-based access to electronic systems, staff confidentiality agreements and regular training. Medical records are retained for the periods required by Nigerian law and professional guidelines, after which they are securely destroyed. Website form submissions are used to respond to you and are not retained longer than necessary.<\/p>","hint":"Paragraphs as <p>, lists as <ul><li>"},{"key":"sec.rights.title","type":"text","label":"Section 6 title","value":"Your rights","hint":""},{"key":"sec.rights.body","type":"html","label":"Section 6 body (HTML)","value":"<ul class=\"rights\" style=\"list-style:none; margin:0\">\n            <li><i data-lucide=\"check-circle-2\"><\/i>Access a copy of your medical record and request a medical report.<\/li>\n            <li><i data-lucide=\"check-circle-2\"><\/i>Ask us to correct inaccurate information.<\/li>\n            <li><i data-lucide=\"check-circle-2\"><\/i>Object to, or withdraw consent for, non-essential uses such as newsletters.<\/li>\n            <li><i data-lucide=\"check-circle-2\"><\/i>Request restriction or deletion where the law permits.<\/li>\n            <li><i data-lucide=\"check-circle-2\"><\/i>Lodge a complaint with the Nigeria Data Protection Commission.<\/li>\n          <\/ul>\n          <p>To exercise these rights, contact our records office using the details in section 10. We respond within 30 days.<\/p>","hint":"Paragraphs as <p>, lists as <ul><li>"},{"key":"sec.cookies.title","type":"text","label":"Section 7 title","value":"Cookies & website data","hint":""},{"key":"sec.cookies.body","type":"html","label":"Section 7 body (HTML)","value":"<p>This website uses only essential technical storage to remember your preferences (for example, a collapsed menu). We do not use advertising trackers. Embedded services - Google Maps, Google Fonts and the Fosterheirs learning platform, may set their own cookies according to their policies. Links to Selar and WhatsApp open third-party services with their own terms.<\/p>","hint":"Paragraphs as <p>, lists as <ul><li>"},{"key":"sec.children.title","type":"text","label":"Section 8 title","value":"Children & elders","hint":""},{"key":"sec.children.body","type":"html","label":"Section 8 body (HTML)","value":"<p>Information about children is collected from a parent or guardian. For Methuselah Project participants, a family member may register on the elder's behalf; the elder's consent is confirmed on clinic day. We take extra care with the records of vulnerable patients.<\/p>","hint":"Paragraphs as <p>, lists as <ul><li>"},{"key":"sec.terms.title","type":"text","label":"Section 9 title","value":"Terms of use","hint":""},{"key":"sec.terms.body","type":"html","label":"Section 9 body (HTML)","value":"<p><strong>Medical information.<\/strong> Content on this website, including blog articles, is for general education and does not constitute medical advice, diagnosis or treatment. Always consult a qualified clinician. In an emergency call +234 803 638 6440 or go to the nearest emergency room.<\/p>\n          <p><strong>Appointments.<\/strong> An online request is not a confirmed booking until our team contacts you. Appointment slots, visiting-consultant days and prices may change without notice.<\/p>\n          <p><strong>Programme information.<\/strong> Course fees, discounts, scholarship percentages and intake dates are published in good faith and may be updated by the respective programme.<\/p>\n          <p><strong>Intellectual property.<\/strong> The Heirs name, logo, photographs and content are the property of Heirs Multispecialist Hospital and its founders and may not be reproduced without written permission.<\/p>\n          <p><strong>Liability.<\/strong> We make reasonable efforts to keep this website accurate and available but do not guarantee uninterrupted access. These terms are governed by the laws of the Federal Republic of Nigeria.<\/p>","hint":"Paragraphs as <p>, lists as <ul><li>"},{"key":"sec.contact.title","type":"text","label":"Section 10 title","value":"Contact","hint":""},{"key":"sec.contact.body","type":"html","label":"Section 10 body (HTML)","value":"<p>Records &amp; Data Protection Office, Heirs Multispecialist Hospital, Beside Aluko House, Irare Estate, Oye-Ekiti, Ekiti State.<br>Email: <a href=\"mailto:contact@heirsspecialisthospital.com.ng\">contact@heirsspecialisthospital.com.ng<\/a> · Phone: <a href=\"tel:+2348036386440\">+234 803 638 6440<\/a><\/p>","hint":"Paragraphs as <p>, lists as <ul><li>"}]}]</script>
