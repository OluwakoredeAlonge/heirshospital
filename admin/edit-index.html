<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Home page | Heirs Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tw.js"></script>
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .postrow { display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--line); }
    .postrow:last-child { border: 0; }
    .postrow img { width: 72px; height: 56px; object-fit: cover; border-radius: 12px; }
    .postrow b { display: block; font-size: 14px; color: var(--ink); }
    .postrow span { font-size: 12px; color: var(--muted); }
  </style>
  <script src="../assets/js/cms.js"></script>
</head>
<body data-admin="pages" data-title="Edit: Home page" data-section="Website content" data-cms-page="index">
  <div id="admin-shell"></div>
  <div class="a-main">
    <div id="admin-topbar"></div>
    <div class="a-content" id="cmsEditor" style="max-width:none"></div>
  </div>
  <script src="../assets/js/admin.js"></script>
  <script src="../assets/js/cms-editor.js"></script>
</body>
</html>
