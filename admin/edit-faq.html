  <script type="application/json" id="cmsDefaults">[{"name":"Hero","fields":[{"key":"hero.bg","type":"image","label":"Background image","value":"assets/img/reception.jpg","hint":""},{"key":"hero.eyebrow","type":"text","label":"Eyebrow","value":"Help Centre","hint":""},{"key":"hero.title","type":"text","label":"Headline","value":"Frequently asked questions","hint":""},{"key":"hero.lead","type":"text","label":"Intro","value":"Everything you need to know before you visit, appointments, payments, emergencies, results and our programmes.","hint":""},{"key":"hero.search","type":"attr","label":"Search placeholder","value":"Search e.g. NHIS, dialysis, opening hours…","hint":""}]},{"name":"Side navigation","fields":[{"key":"nav.general","type":"text","label":"Nav: About the hospital","value":"About the hospital","hint":""},{"key":"nav.appointments","type":"text","label":"Nav: Appointments","value":"Appointments","hint":""},{"key":"nav.payments","type":"text","label":"Nav: Payments & insurance","value":"Payments & insurance","hint":""},{"key":"nav.emergency","type":"text","label":"Nav: Emergencies","value":"Emergencies","hint":""},{"key":"nav.services","type":"text","label":"Nav: Services & results","value":"Services & results","hint":""},{"key":"nav.programmes","type":"text","label":"Nav: Our programmes","value":"Our programmes","hint":""}]},{"name":"About the hospital","fields":[{"key":"general.title","type":"text","label":"Group title","value":"About the hospital","hint":""},{"key":"general.items","type":"list","label":"Questions","fields":[{"key":"q","type":"text","label":"Question","hint":""},{"key":"a","type":"html","label":"Answer (basic HTML allowed)","hint":""}],"value":[{"q":"What is Heirs Multispecialist Hospital?","a":"Heirs Multi-Specialist Hospital and Diagnostic Centre (also known as Heirs Specialist Hospital) is a 50-bed, NHIS-accredited specialist hospital in Ekiti State, founded by Dr. Michael Soje and Dr. (Mrs) Anthonia Soje. It offers renal dialysis, CT scan, intensive care, surgery, cardiology, obstetrics, dental, eye care, laboratory &amp; blood bank, pharmacy, mental-health services and 24/7 emergency care from two branches in Oye-Ekiti and Ado-Ekiti."},{"q":"What are your opening hours?","a":"Monday–Friday 8:00 AM – 8:00 PM; Saturday 9:00 AM – 8:30 PM; Sunday 1:00 PM – 8:00 PM. Emergency services are available 24 hours a day, every day."},{"q":"Where are you located?","a":"<strong>Oye-Ekiti (Main Branch):<\/strong> Beside Aluko House, Irare Estate, Oye-Ekiti, Ekiti State.<br><strong>Ado-Ekiti Branch:<\/strong> Plot 3, Orimolade Crescent, Ilokun Estate, Ado-Ekiti, Ekiti State. Both are in serene, secure neighbourhoods with parking. See <a href=\"contact.html\">directions<\/a>."},{"q":"Who are the doctors at Heirs?","a":"Our clinical team is led by Medical Director Dr. Michael Soje (internal medicine &amp; gastroenterology) and includes specialist and visiting doctors, nurses and allied-health professionals. Mental-health services are led by Dr. (Mrs) Anthonia Soje through Fosterheirs."},{"q":"Are you NHIS accredited?","a":"Yes. Heirs is an accredited provider under the National Health Insurance Scheme (NHIS/NHIA) and also partners with private HMOs. See the <a href=\"#payments\">payments section<\/a> for details."}],"hint":""}]},{"name":"Appointments","fields":[{"key":"appointments.title","type":"text","label":"Group title","value":"Appointments","hint":""},{"key":"appointments.items","type":"list","label":"Questions","fields":[{"key":"q","type":"text","label":"Question","hint":""},{"key":"a","type":"html","label":"Answer (basic HTML allowed)","hint":""}],"value":[{"q":"How do I book an appointment?","a":"Use the <a href=\"contact.html#book\">online booking form<\/a>, call +234 803 638 6440, WhatsApp +234 704 248 1085, or walk into either branch. Booked patients are seen first."},{"q":"How far in advance should I book?","a":"Book as early as you can, especially for specialist clinics, so our front desk can place you with the right doctor. We will offer you the earliest available slot when we confirm."},{"q":"Can I cancel or reschedule?","a":"Yes. Call or WhatsApp us as early as possible and we will reschedule you."},{"q":"Do I need a referral to see a specialist?","a":"No referral is required. If you have one, bring it, along with previous results, so the specialist has your full history."},{"q":"What should I bring to my appointment?","a":"A valid ID, your NHIS/HMO card (if applicable), previous medical records or test results, and a list of your current medications and allergies. Arrive 15 minutes early for registration."}],"hint":""}]},{"name":"Payments & insurance","fields":[{"key":"payments.title","type":"text","label":"Group title","value":"Payments & insurance","hint":""},{"key":"payments.items","type":"list","label":"Questions","fields":[{"key":"q","type":"text","label":"Question","hint":""},{"key":"a","type":"html","label":"Answer (basic HTML allowed)","hint":""}],"value":[{"q":"What payment methods do you accept?","a":"Cash, bank transfer, debit/credit cards (POS), NHIS and partner HMO coverage. Receipts and itemised invoices are issued for every payment."},{"q":"Do you accept health insurance / HMOs?","a":"Yes. We are NHIS-accredited and work with several HMOs. Bring your card and ID; our billing desk verifies coverage before treatment and explains any co-payments up front."},{"q":"Can I get an invoice or medical report for my employer or insurer?","a":"Yes. Medical reports, sick-leave certificates, fitness certificates and itemised invoices can be requested at the front desk or by email."},{"q":"Do you offer payment plans for expensive treatments?","a":"For major procedures such as surgery, dialysis programmes or joint replacement, please speak to our billing desk before your procedure about the payment options available."}],"hint":""}]},{"name":"Emergencies","fields":[{"key":"emergency.title","type":"text","label":"Group title","value":"Emergencies","hint":""},{"key":"emergency.items","type":"list","label":"Questions","fields":[{"key":"q","type":"text","label":"Question","hint":""},{"key":"a","type":"html","label":"Answer (basic HTML allowed)","hint":""}],"value":[{"q":"Is your emergency department open 24/7?","a":"Yes. Emergency services are available 24 hours a day, every day, backed by 24-hour solar power. Call <a href=\"tel:+2348036386440\">+234 803 638 6440<\/a>."},{"q":"Do you have ambulance services?","a":"Yes. We operate ambulance services with trained paramedics for emergency pick-up and inter-facility transfers within and around Ekiti State."},{"q":"What qualifies as a medical emergency?","a":"Chest pain, difficulty breathing, stroke symptoms (face drooping, arm weakness, speech difficulty), severe bleeding, serious injury or burns, loss of consciousness, seizures, severe abdominal pain, complications in pregnancy, or a very high fever in a child. If in doubt, call us."},{"q":"Do you have an intensive care unit?","a":"Yes. Heirs provides intensive and critical care services for critically ill patients, including post-operative care."}],"hint":""}]},{"name":"Services & results","fields":[{"key":"services.title","type":"text","label":"Group title","value":"Services & results","hint":""},{"key":"services.items","type":"list","label":"Questions","fields":[{"key":"q","type":"text","label":"Question","hint":""},{"key":"a","type":"html","label":"Answer (basic HTML allowed)","hint":""}],"value":[{"q":"What medical services do you offer?","a":"Clinical consultations, renal dialysis (haemo &amp; peritoneal), heart &amp; cardiovascular treatment with cardiopulmonary tests, CT scan, digital X-ray &amp; ultrasound, general &amp; specialised surgery, hip &amp; knee replacement, obstetrics &amp; gynaecology, cancer treatment (prostate, breast etc.), intensive &amp; critical care, full laboratory with blood bank, complete dental services, eye treatment, pharmacy, nutrition &amp; dietetics, physiotherapy, and trauma &amp; addiction-recovery therapy. See <a href=\"services.html\">all services<\/a>."},{"q":"Do you offer dialysis?","a":"Yes. Heirs offers specialised treatment of kidney disease with haemodialysis and a peritoneal dialysis option. Book a consultation to be assessed and scheduled."},{"q":"Do you have a CT scanner?","a":"Yes. Our radiology department offers computerised tomography (CT) scans alongside digital X-ray and ultrasound."},{"q":"How long do lab results take?","a":"Turnaround depends on the test. The laboratory will tell you when to expect your results, which can be collected in person or sent to you on request."},{"q":"Do you perform surgeries?","a":"Yes, general and specialised surgery including hip &amp; knee replacement, cancer surgery and obstetric &amp; gynaecological procedures, with post-operative ICU care available."},{"q":"Can I get medical certificates or reports?","a":"Yes. Sick-leave certificates, fitness-to-work reports, pre-employment medicals and detailed medical reports are available on request from the front desk."}],"hint":""}]},{"name":"Our programmes","fields":[{"key":"programmes.title","type":"text","label":"Group title","value":"Our programmes","hint":""},{"key":"programmes.items","type":"list","label":"Questions","fields":[{"key":"q","type":"text","label":"Question","hint":""},{"key":"a","type":"html","label":"Answer (basic HTML allowed)","hint":""}],"value":[{"q":"What is Fosterheirs Mental Health Consultancy?","a":"Fosterheirs is the hospital's mental-health arm, founded in 2023 by Dr. Anthonia Soje. It offers psycho-trauma therapy, outpatient and residential addiction recovery, marriage &amp; premarital counselling, individual therapy, self-help courses and professional certifications. <a href=\"fosterheirs.html\">Learn more<\/a>."},{"q":"What is the Methuselah Project and who is eligible?","a":"A free monthly healthcare clinic for elders aged 65 and above who face financial hardship, run by Heirs Missions every third Saturday (8 AM – 2 PM) at the Oye-Ekiti branch. Consultations, lab tests, medications and health education are 100% free. Pre-registration is required at least 3 days ahead. <a href=\"methuselah.html\">Register an elder<\/a>."},{"q":"What does Heirs Institute of Allied Health offer?","a":"Accredited programmes for Community Health Extension Workers, Pharmacy Technicians, Medical Laboratory Technicians, Health Information Management, Radiography Technicians, Dental Technology, Physiotherapy Assistants and Environmental Health Technology, with clinical practice inside the hospital and scholarships available. <a href=\"heirs-institute.html\">See programmes<\/a>."}],"hint":""}]},{"name":"Call to action","fields":[{"key":"cta.eyebrow","type":"text","label":"Eyebrow","value":"Still have questions?","hint":""},{"key":"cta.title","type":"text","label":"Heading","value":"Our team is one call away.","hint":""},{"key":"cta.lead","type":"text","label":"Text","value":"Call, WhatsApp or email and our team will help.","hint":""}]}]</script>
