  <script type="application/json" id="cmsDefaults">[{"name":"Hero","fields":[{"key":"hero.bg","type":"image","label":"Background image","value":"assets/img/oye-exterior-side.jpg","hint":""},{"key":"hero.eyebrow","type":"text","label":"Eyebrow","value":"Who We Are","hint":""},{"key":"hero.title","type":"text","label":"Headline","value":"Your caring family hospital in the heart of Ekiti.","hint":""},{"key":"hero.lead","type":"text","label":"Intro","value":"Heirs Multispecialist Hospital is a world-class specialist hospital set to end medical tourism in Nigeria, offering high-quality medical services comparable to what is obtainable in leading hospitals in Nigeria and elsewhere.","hint":""},{"key":"hero.cta1","type":"text","label":"Button 1","value":"Meet the Founders","hint":""},{"key":"hero.cta2","type":"text","label":"Button 2","value":"Our Facilities","hint":""}]},{"name":"Stats bar","fields":[{"key":"stats.1.value","type":"attr","label":"Beds number","value":"50","hint":""},{"key":"stats.1.unit","type":"text","label":"Beds word","value":"Beds","hint":""},{"key":"stats.1.sub","type":"text","label":"Beds subtitle","value":"Inpatient capacity","hint":""},{"key":"stats.2.value","type":"attr","label":"Patients number","value":"16612","hint":""},{"key":"stats.2.sub","type":"text","label":"Patients subtitle","value":"Patients served","hint":""},{"key":"stats.3.value","type":"text","label":"Branches","value":"2 Branches","hint":""},{"key":"stats.3.sub","type":"text","label":"Branches subtitle","value":"Oye-Ekiti & Ado-Ekiti","hint":""},{"key":"stats.4.value","type":"attr","label":"Years number","value":"10","hint":""},{"key":"stats.4.unit","type":"text","label":"Years word","value":"Years","hint":""},{"key":"stats.4.sub","type":"text","label":"Years subtitle","value":"Of creditable care","hint":""}]},{"name":"Purpose","fields":[{"key":"purpose.eyebrow","type":"text","label":"Eyebrow","value":"Our Purpose","hint":""},{"key":"purpose.title","type":"text","label":"Heading","value":"Excellence in healthcare, delivered with compassion.","hint":""},{"key":"purpose.lead","type":"text","label":"Paragraph 1","value":"Located in serene neighbourhoods in Oye-Ekiti and Ado-Ekiti, Heirs was built on a simple conviction: families in Ekiti deserve access to specialist care without travelling to Lagos, Abuja or abroad.","hint":""},{"key":"purpose.text","type":"text","label":"Paragraph 2","value":"From renal dialysis and CT imaging to intensive care, surgery and integrated mental-health services, every unit is designed to bring the best of medical practice home, with the warmth of a family hospital.","hint":""},{"key":"purpose.tagline","type":"text","label":"Tagline","value":"Your Caring Family Hospital","hint":""},{"key":"purpose.motto","type":"text","label":"Motto","value":"Bringing the Best of Medical Practice to Ekiti","hint":""},{"key":"purpose.mission.title","type":"text","label":"Our Mission title","value":"Our Mission","hint":""},{"key":"purpose.mission.text","type":"text","label":"Mission text","value":"To provide world-class, affordable and compassionate specialist healthcare to the people of Ekiti State and beyond, combining expert clinicians, modern technology and a patient-first culture.","hint":""},{"key":"purpose.vision.title","type":"text","label":"Our Vision title","value":"Our Vision","hint":""},{"key":"purpose.vision.text","type":"text","label":"Vision text","value":"To be the leading multispecialist hospital in South-West Nigeria, ending the need for medical tourism by delivering care comparable to the best hospitals in Nigeria and internationally.","hint":""},{"key":"purpose.promise.title","type":"text","label":"Our Promise title","value":"Our Promise","hint":""},{"key":"purpose.promise.text","type":"text","label":"Promise text","value":"Every patient is treated as family: listened to, respected and cared for holistically, mind, body and spirit, from the first consultation to full recovery.","hint":""}]},{"name":"Timeline","fields":[{"key":"journey.eyebrow","type":"text","label":"Eyebrow","value":"Our Journey","hint":""},{"key":"journey.title","type":"text","label":"Heading","value":"A decade of growing with Ekiti.","hint":""},{"key":"journey.lead","type":"text","label":"Intro","value":"What began as a specialist hospital in Oye-Ekiti has grown into a health ecosystem spanning two branches, a mental-health consultancy, an allied-health institute and a free monthly clinic for elders.","hint":""},{"key":"journey.photo","type":"image","label":"Photo","value":"assets/img/oye-exterior.jpg","hint":""},{"key":"journey.photoTitle","type":"text","label":"Photo caption","value":"Oye-Ekiti Main Branch","hint":""},{"key":"journey.photoSub","type":"text","label":"Photo sub-caption","value":"Beside Aluko House, Irare Estate","hint":""},{"key":"journey.items","type":"list","label":"Milestones","fields":[{"key":"year","type":"text","label":"Year","hint":""},{"key":"title","type":"text","label":"Title","hint":""},{"key":"text","type":"text","label":"Text","hint":""}],"value":[{"year":"2015","title":"Heirs Specialist Hospital opens in Oye-Ekiti","text":"Dr. Michael Soje and Dr. (Mrs) Anthonia Soje establish Heirs beside Aluko House, Irare Estate, Oye-Ekiti, as a world-class specialist hospital set to end medical tourism in Nigeria."},{"year":"Expansion","title":"Second branch in Ado-Ekiti","text":"A second branch opens at Plot 3, Orimolade Crescent, Ilokun Estate, Ado-Ekiti, bringing Heirs care to the state capital."},{"year":"Growth","title":"Multi-specialist & diagnostic services","text":"Renal dialysis with a peritoneal option, CT scan, intensive & critical care, a full laboratory with blood bank, 24-hour solar power and ambulance services make Heirs a true multi-specialist hospital and diagnostic centre."},{"year":"2023","title":"Fosterheirs Mental Health Consultancy","text":"Founded within the hospital complex to integrate medicine, psychology and faith for trauma therapy, addiction recovery and marriage restoration."},{"year":"Training","title":"Heirs Institute of Allied Health","text":"A subsidiary of the hospital, established to address the critical shortage of skilled allied-health professionals in Nigeria, drawing on over a decade of healthcare experience in Ekiti State."},{"year":"Outreach","title":"The Methuselah Project","text":"Heirs Missions, the charitable division of the hospital, runs a free monthly healthcare programme for elders aged 65 and above: consultations, tests and medications at no cost."},{"year":"10 Years","title":"10th anniversary celebration","text":"Heirs marks a decade of care with the commissioning of a new multipurpose building at Oye-Ekiti and the launch of books by co-founder Dr. Anthonia Soje."},{"year":"Today","title":"50 beds. 16,612+ patients. One family.","text":"Two branches, 16+ specialist services, NHIS accreditation and a team of specialist and visiting doctors, still guided by the same promise of care."}],"hint":""}]},{"name":"Founders","fields":[{"key":"founders.eyebrow","type":"text","label":"Eyebrow","value":"Our Founders","hint":""},{"key":"founders.title","type":"text","label":"Heading","value":"The physician couple behind Heirs","hint":""},{"key":"founders.lead","type":"text","label":"Intro","value":"A husband-and-wife team who combined internal medicine and mental health into one integrated vision of care.","hint":""},{"key":"founders.photo","type":"image","label":"Founders photo","value":"assets/img/founders.jpg","hint":""},{"key":"founders.1.name","type":"text","label":"Founder 1 name","value":"Dr. Michael Soje","hint":""},{"key":"founders.1.role","type":"text","label":"Founder 1 role","value":"Co-Founder & Medical Director","hint":""},{"key":"founders.1.bio1","type":"text","label":"Founder 1 bio (paragraph 1)","value":"A distinguished consultant physician in internal medicine with extensive experience and research interest in gastroenterology. Dr. Soje is affiliated with the Federal Teaching Hospital, Ido-Ekiti and Afe Babalola University (ABUAD), and his contributions to the understanding of gastroenterological conditions have advanced medical knowledge in Nigeria.","hint":""},{"key":"founders.1.bio2","type":"text","label":"Founder 1 bio (paragraph 2)","value":"As Medical Director, he leads Heirs' clinical governance, from the dialysis unit and ICU to specialist clinics, ensuring every protocol meets international best practice.","hint":""},{"key":"founders.1.tags","type":"lines","label":"Founder 1 tags","value":["Internal Medicine","Gastroenterology","Clinical Governance","FTH Ido-Ekiti","ABUAD"],"hint":""},{"key":"founders.2.name","type":"text","label":"Founder 2 name","value":"Dr. (Mrs) Anthonia Yemisi Soje","hint":""},{"key":"founders.2.role","type":"text","label":"Founder 2 role","value":"Co-Founder, Hospital Administrator & Lead Therapist","hint":""},{"key":"founders.2.bio1","type":"text","label":"Founder 2 bio (paragraph 1)","value":"Physician, hospital administrator, entrepreneur, educator and speaker. Dr. Anthonia Soje is a board-certified psycho-trauma therapist, addiction-recovery therapist, certified transformational life coach and certified Christian marriage & sexuality coach. She founded Fosterheirs Mental Health Consultancy within the hospital complex in 2023.","hint":""},{"key":"founders.2.bio2","type":"html","label":"Founder 2 bio (paragraph 2)","value":"She is the author of ten books, including <em>The Addiction Compass</em>, <em>Echoes of Eden</em>, <em>Sanctuary</em> and <em>The Fourfold Path to Freedom</em>, and practises CBT, Compassionate Inquiry, Inner-Child Work and Hypnotherapy.","hint":""},{"key":"founders.2.tags","type":"lines","label":"Founder 2 tags","value":["Psycho-trauma Therapy","Addiction Recovery","Marriage Coaching","Author of 10 Books","Hospital Administration"],"hint":""}]},{"name":"Core values","fields":[{"key":"values.eyebrow","type":"text","label":"Eyebrow","value":"Core Values","hint":""},{"key":"values.title","type":"text","la
