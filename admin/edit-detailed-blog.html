  <script type="application/json" id="cmsDefaults">[{"name":"Article header","fields":[{"key":"head.cat","type":"text","label":"Category badge","value":"Heart Health","hint":""},{"key":"head.tag","type":"text","label":"Tag badge","value":"Prevention","hint":""},{"key":"head.read","type":"text","label":"Read time badge","value":"6 min read","hint":""},{"key":"head.title","type":"text","label":"Article title","value":"Understanding heart health: prevention and care for Nigerian families","hint":""},{"key":"head.lead","type":"text","label":"Standfirst","value":"Heart disease is a leading cause of death in Nigeria, yet much of it is preventable. Here is what the numbers mean, the tests that matter, and what you can do this week.","hint":""},{"key":"head.initials","type":"text","label":"Author initials","value":"HH","hint":""},{"key":"head.author","type":"text","label":"Author name","value":"Heirs Health Desk","hint":""},{"key":"head.byline","type":"text","label":"Byline","value":"General health information · Heirs Multispecialist Hospital","hint":""},{"key":"head.img","type":"image","label":"Hero image","value":"assets/img/blog-fitness.jpg","hint":""}]},{"name":"Article body & sidebar","fields":[{"key":"toc","type":"list","label":"Table of contents","fields":[{"key":"link","type":"link","label":"Link","hint":""}],"value":[{"link":{"text":"Why heart disease is rising","href":"#why"}},{"link":{"text":"The 3 numbers to know","href":"#numbers"}},{"link":{"text":"Key prevention strategies","href":"#prevention"}},{"link":{"text":"Tests that matter","href":"#tests"}},{"link":{"text":"Treatment options","href":"#treatment"}},{"link":{"text":"When it's an emergency","href":"#emergency"}}],"hint":"Links must match the id of an h2 in the article body, e.g. #why"},{"key":"toc.ctaTitle","type":"text","label":"TOC card title","value":"Worried about your heart?","hint":""},{"key":"toc.ctaText","type":"text","label":"TOC card text","value":"Book a consultation with our team.","hint":""},{"key":"toc.ctaBtn","type":"link","label":"TOC card button","value":{"text":"Book now","href":"contact.html#book"},"hint":""},{"key":"body","type":"html","label":"Article body (HTML)","value":"<h2 id=\"why\">Why heart disease is rising in Nigeria<\/h2>\n          <p>Heart disease is no longer a condition of the elderly alone. Younger adults are increasingly affected by hearts damaged through years of untreated hypertension. Diets have changed, people sit more, stress has increased, and, crucially, many people never check their blood pressure until something goes wrong.<\/p>\n          <p>The good news is that the biggest drivers, high blood pressure, diabetes, high cholesterol, smoking and inactivity, are all things we can measure and change.<\/p>\n          <div class=\"callout warn\"><span class=\"icon-box coral\"><i data-lucide=\"alert-triangle\"><\/i><\/span><div><strong>Half of adults with hypertension don't know they have it<\/strong><p>High blood pressure has no symptoms until it causes a stroke, heart attack or kidney failure. A two-minute check at any of our branches is the most valuable test you'll do this year.<\/p><\/div><\/div>\n\n          <h2 id=\"numbers\">The three numbers you must know<\/h2>\n          <ol class=\"num-list\">\n            <li><div><strong>Blood pressure, aim below 130/80 mmHg.<\/strong> Above 140/90 on two separate readings is hypertension and needs a plan.<\/div><\/li>\n            <li><div><strong>Fasting blood sugar, aim below 100 mg/dL.<\/strong> Diabetes quietly damages the vessels that feed the heart.<\/div><\/li>\n            <li><div><strong>Total cholesterol, aim below 200 mg/dL.<\/strong> Especially important if heart disease runs in your family.<\/div><\/li>\n          <\/ol>\n\n          <h2 id=\"prevention\">Key prevention strategies<\/h2>\n          <h3>1. Cut down on salt, including the hidden salt<\/h3>\n          <p>Stock cubes, seasoning powders, smoked fish and processed meats add far more sodium than the salt you sprinkle. Aim for less than one teaspoon of total salt a day. Use pepper, ginger, garlic, onions and local herbs for flavour instead.<\/p>\n          <h3>2. Move for 30 minutes, five days a week<\/h3>\n          <p>You don't need a gym. A brisk walk to the market, taking the stairs, or 30 minutes of dancing counts. The heart is a muscle, it gets stronger with use.<\/p>\n          <h3>3. Eat like your grandparents did<\/h3>\n          <p>More beans, vegetables, fruit, whole grains and fish; fewer fried snacks, sugary drinks and \"fast\" foods. Heirs offers <a href=\"services.html#nutrition\">nutrition &amp; dietetics<\/a> services to help you plan around the foods you already love.<\/p>\n          <h3>4. Stop smoking, limit alcohol<\/h3>\n          <p>Within one year of quitting, your risk of heart disease drops by half. Alcohol should be no more than one drink a day, and none at all if you have high blood pressure or liver disease.<\/p>\n          <h3>5. Manage stress and sleep<\/h3>\n          <p>Chronic stress raises blood pressure and drives unhealthy eating. If anxiety or trauma is part of your story, our colleagues at <a href=\"fosterheirs.html\">Fosterheirs<\/a> can help, the mind and the heart are connected.<\/p>\n          <div class=\"callout tip\"><span class=\"icon-box teal\"><i data-lucide=\"lightbulb\"><\/i><\/span><div><strong>Family history matters<\/strong><p>If a parent or sibling had a heart attack or stroke before age 60, start screening at 30, not 50.<\/p><\/div><\/div>\n\n          <h2 id=\"tests\">The tests that actually matter<\/h2>\n          <p>A heart check-up typically includes a blood pressure profile, an electrocardiogram (ECG) to look at the heart's rhythm, and blood tests for sugar, cholesterol and kidney function. Heirs offers heart and cardiovascular disease treatment together with cardiopulmonary tests.<\/p>\n\n          <h2 id=\"treatment\">Treatment options<\/h2>\n          <p>Treatment starts with lifestyle change, but many patients also need medication, and there is no shame in that. Taken consistently, blood-pressure and cholesterol medicines prevent many strokes and heart attacks. Heirs provides heart and cardiovascular disease treatment, with referral for specialised procedures where needed.<\/p>\n          <blockquote>\"The best heart medicine is the one you actually take every day. Bring your tablets to every visit so we can simplify your routine.\"<\/blockquote>\n\n          <h2 id=\"emergency\">When it's an emergency<\/h2>\n          <p>Call <a href=\"tel:+2348036386440\">+234 803 638 6440<\/a> or come straight to the hospital if you or someone near you has: crushing chest pain or pressure lasting more than a few minutes; pain spreading to the arm, jaw or back; sudden breathlessness; fainting; or stroke signs, face drooping, arm weakness, slurred speech. Do not drive yourself. Emergency services are available 24 hours a day, every day.<\/p>","hint":"Use <h2 id=\"...\"> for sections, <h3> for sub-headings, <p> for paragraphs, <blockquote> for quotes. Callout boxes: <div class=\"callout tip\"> or <div class=\"callout warn\">"},{"key":"author.initials","type":"text","label":"Author box initials","value":"HH","hint":""},{"key":"author.name","type":"text","label":"Author box name","value":"Heirs Health Desk","hint":""},{"key":"author.role","type":"text","label":"Author box role","value":"Heirs Multi-Specialist Hospital and Diagnostic Centre","hint":""},{"key":"author.bio","type":"text","label":"Author box bio","value":"General health information from Heirs. It does not replace a consultation; speak to a doctor about your own health.","hint":""},{"key":"side.promoTitle","type":"text","label":"Promo card title","value":"Heart & cardiovascular care","hint":""},{"key":"side.promoText","type":"text","label":"Promo card text","value":"Heirs offers heart and cardiovascular disease treatment with cardiopulmonary tests.","hint":""},{"key":"side.promoBtn","type":"link","label":"Promo card button","value":{"text":"Book a consultation","href":"contact.html#book"},"hint":""},{"key":"side.relatedTitle","type":"text","label":"Related heading","value":"Related reading","hint":""},{"key":"side.related","type":"list","label":"Related articles","fields":[{"key":"link","type":"link","label":"Article","hint":""}],"value":[{"link":{"text":"Hypertension: the silent killer and the 3 numbers you must know","href":"blog.html"}},{"link":{"text":"Five early warning signs of kidney disease","href":"blog.html"}},{"link":{"text":"Eating well with diabetes: a practical Ekiti kitchen guide","href":"blog.html"}}],"hint":""},{"key":"side.disclaimer","type":"text","label":"Disclaimer","value":"This article is for general education and does not replace a consultation. Always speak to a doctor about your own health.","hint":""}]},{"name":"Call to action","fields":[{"key":"cta.eyebrow","type":"text","label":"Eyebrow","value":"Take charge of your heart health","hint":""},{"key":"cta.title","type":"text","label":"Heading","value":"A check-up today prevents an emergency tomorrow.","hint":""}]}]</script>
